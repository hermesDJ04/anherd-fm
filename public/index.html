<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anherd FM - Your Sound. Your Story.</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css?family=Audiowide|Poppins&display=swap" rel="stylesheet">
</head>
<body class="landing-page">

<!-- Navigation Bar -->
<nav class="navbar">
  <div class="nav-logo">
    <a href="/index.html">
      <img src="/images/logoorg.png" alt="Click to go">
    </a>
  </div>

  <div class="hero-content">
    <h1 style="font-size:50px; margin-right: 40px; font-family: 'Audiowide', sans-serif;">AnHerd FM</h1>
  </div>  

  <div class="nav-login">
    <button onclick="window.location.href='/login.html'">Login</button>
  </div>
</nav>

<!-- Hero Section -->
<section class="hero">
  <div class="hero-content">
    <h1 style="font-size:50px; margin-right: -20px; margin-bottom:30px; font-family: 'Audiowide', sans-serif;">Your Sound. Your Story.</h1>
    <button class="explore-btn" onclick="window.location.href='/radio.html'">Live Radio</button>
  </div>
</section>


<!-- About Us Section -->
<section class="about-section">
  <div class="about-content">
    <h2>About Us</h2>
    <p>At AnHerd FM, we bring places to life. A station created by a DJ, delivering the true music vibe everywhere and anywhere in the world. Feel the sound.</p>
  </div>
</section>

<!-- Contact Us Section -->
<section class="contact-section">
  <div class="contact-content">
    <h2>Contact Us</h2>
    <form class="contact-form" action="https://formsubmit.co/info@anherdfm.com" method="post">
      <input type="text" placeholder="Your Name" required>
      <input type="tel" placeholder="Phone Number" required>
      <input type="email" placeholder="Email Address" required>
      <button type="submit">Submit</button>
    </form>
  </div>
</section>

<!-- Footer / Social Media -->
<footer class="footer">
  <div class="social-icons">
    <a href="https://facebook.com/" target="_blank"><img src="/images/facebook.png" alt="Facebook"></a>
    <a href="https://instagram.com/" target="_blank"><img src="/images/instagram.png" alt="Instagram"></a>
    <a href="https://youtube.com/" target="_blank"><img src="/images/TikTok.png" alt="TikTok"></a>
  </div>
  <p>© 2025 Anherd FM. All Rights Reserved.</p>
</footer>

</body>
</html>
