<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Login - Anherd FM</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css?family=Audiowide|Poppins&display=swap" rel="stylesheet">
</head>
<body class="login-page">

<div class="login-container">
  <a href="/index.html">
    <img src="/images/logoorg.png" alt="Anherd FM Logo" class="login-logo">
  </a>

  <h1>Login</h1>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" class="login-btn">Login</button>
    <p id="message"></p>
  </form>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const response = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();
    if (data.success) {
      window.location.href = data.playlist;
    } else {
      document.getElementById('message').innerText = data.message;
    }
  });
  
</script>

</body>
</html>
